# Settings for one project's runner. Sourced by zsh and read by Python, so:
# one KEY=value per line, no spaces round the =, no comment after a value,
# single quotes round any value holding spaces or symbols. Lists are words
# separated by spaces. The scripts find this file through RUNNER_CONF, or as
# runner.conf in the directory they are started from. Every key is described
# in the kit's schema/runner.conf.schema.json.

# The project's name, as the prompts and notices say it.
PROJECT=example

# Active oversight belongs to the originating Claude or Codex session.
# These settings are required for new projects. Existing configs without the
# switch keep their behaviour until explicitly migrated. No task-time limit
# is imposed: the timeout detects missing supervision, not slow useful work.
GOAL=
SUPERVISION_REQUIRED=yes
ORIGIN_AGENT=
ORIGIN_SESSION=
SUPERVISION_INTERVAL=300
SUPERVISION_TIMEOUT=900
# Optional bridge: receives an event as JSON on stdin and returns the
# originating session's review. Otherwise that session uses runner_watch.py
# pending/review, with a supported recurring wake-up. See docs/supervision.md.
SUPERVISOR_CMD=
# Existing local helper, with webhook credentials outside Git.
COORDINATOR_CMD=~/.local/bin/notify-coordinator
# Exercise the delivered result as the intended user. Return the evidence
# JSON described in docs/supervision.md. Unit tests alone cannot supply it.
ACCEPTANCE_CMD=

# The workspace: holds TASKS.md, DECISIONS.md, DELIVERY-RULES.yaml,
# SESSION-PROMPT.md, REVIEW-CLAUDE.md, REVIEW-CODEX.md, SUPERVISOR-PROMPT.md,
# RUN-ORDER.md and runs/. It must be inside a git repository.
WORKSPACE=/path/to/workspace

# The code repository or repositories task sessions work in. A session starts
# in the first; the others are added as extra directories.
REPOS='/path/to/repo'

# Caller check: a function added to a .py file under one of these directories
# (paths from the repository root, each ending in /) must be used by code under
# them. Empty switches the check off.
PRODUCT_DIRS='src/'

# New-file check: files added under these directories need not be named in the
# task. The workspace's runs/ directory is always free.
FREE_DIRS='tests/'

# Optional. Caller check: a file (path from the repository root) that registers
# functions by name as "module.path", "function"; a function listed there counts
# as called.
REGISTRY_FILE=

# Optional. Live-switch check: a commit that adds a line matching the pattern
# (a Python regular expression) to a file whose path ends with LIVE_FLAG_FILE is
# refused while an open task says the user would see something false. Both
# empty switches the check off. Example pattern: '"(sync_enabled|sharing_enabled)"\s*:\s*true'
LIVE_FLAG_PATTERN=
LIVE_FLAG_FILE=

# How the owner is told that a task is done, stopped or parked, or that the
# queue is idle: none (the log runs/notify.log only), desktop (a desktop
# notice), or command (NOTIFY_CMD, which receives the message as one argument).
NOTIFY=none
NOTIFY_CMD=

# Optional. The dashboard this project's runner reports to (the kit's
# dashboard/serve.py), as an address, for example http://127.0.0.1:8787. Left
# empty, the runner uses the machine's own setting if there is one
# (~/.config/runner-kit/dashboard.conf, read by every runner on the machine);
# "off" reports to nobody. A dashboard's token is never written here, because
# this file is in git: it goes in the machine's file, or in
# RUNNER_DASHBOARD_TOKEN in the environment.
DASHBOARD_URL=

# Optional. A command run before each task; if it fails the runner prints a
# warning and carries on. Example: 'curl -s -m 3 http://localhost:8000/health'
PREFLIGHT_CMD=

# Optional. The project's own check, for example its test suite: one shell
# command, run from the first repository, that exits 0 when the project is
# sound. The runner runs it itself, before a task's first session and again on
# the task's commit, and does not take the session's word for it. A commit that
# turns a passing check into a failing one sends the same session back to
# repair it. If it already fails before a task, the owner is told once and
# tasks carry on. Give it only checks that give the same answer twice.
# Example: 'python3 -m pytest -q -x'
CHECK_CMD=

# How many different tasks may stop one after another before the queue pauses
# and tells the owner. 0 never pauses.
STOP_STREAK=3

# The letters a task's M and R columns may use. Each letter needs an adapter
# (a file in the kit's adapters/ directory, without .sh) and a model id for
# that agent. Pin exact model ids, not aliases: an alias can resolve to an
# older model without notice. The current owner selection is
# gpt-6.1-sol for both Codex task builders and reviewers.
# A letter with an empty model is not usable.
#   S  contained changes with a clear recipe, usually at medium effort
#   O  judgement and review, at the task's assigned effort
#   C  another explicitly assigned task role
ADAPTER_S=codex
MODEL_S=gpt-6.1-sol
ADAPTER_O=codex
MODEL_O=gpt-6.1-sol
ADAPTER_C=codex
MODEL_C=gpt-6.1-sol

# The exact newer client used by Codex builders, resumes, reviews and checks.
# Empty selects the ChatGPT desktop bundled client. Other installations must
# name an absolute path to Codex 0.162.0 or newer. No older PATH fallback.
CODEX_BIN=
# Never change a selected model or downgrade after an error without Will's
# explicit permission. Preserve work and report the configuration failure.

# The letter and effort a new task gets when nothing argues otherwise, and the
# one reviewer's letter and effort. Read by the supervising session when it
# writes tasks, and by the kit's self-test.
DEFAULT_BUILDER=S
DEFAULT_EFFORT=medium
DEFAULT_REVIEWER='O high'

# The letter whose adapter and model run a stop session (PROTOCOL.md section 8).
SUPERVISOR=O

# Claude adapter. CLAUDE_ALLOWED_TOOLS: tools an unattended session may use
# without asking, as words. A session must run shell commands (git, the
# done-when check), so the default allows Bash; narrow it (for example
# 'Bash(git:*) Bash(python3:*)') or empty it to rely on the machine's own
# Claude Code settings. CLAUDE_MIN_VERSION: optional; refuse to start on an
# older command-line version (for example 2.1.280).
CLAUDE_ALLOWED_TOOLS='Bash'
CLAUDE_MIN_VERSION=

# Claude adapter: what a session carries. Every tool's description is re-read
# on every turn of every session, so a short list costs less. CLAUDE_TOOLS is
# the built-in tools a session is given (Task starts the one reviewer); empty
# gives every tool. CLAUDE_MCP=no starts sessions without the machine's MCP
# servers and connectors; yes leaves them as the machine has them. Widen
# either only for a project whose tasks need it.
CLAUDE_TOOLS='Bash Read Edit Write Task'
CLAUDE_MCP=no

# Does the project deploy? yes means the workspace has a deploy.sh that proves
# live (PROTOCOL.md section 9). LIVE_CHECK_CMD is the command that proves what
# is live: it prints the commit the running system reports as the first word of
# its output. deploy.sh uses it.
DEPLOYS=no
LIVE_CHECK_CMD=
