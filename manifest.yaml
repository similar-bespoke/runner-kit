# The machine-readable index of the runner kit. An installing agent reads this
# file, interview.yaml and PROTOCOL.md in full before acting.
# <kit> is the directory this file is in. <workspace> and <repo> come from
# the answers to interview.yaml.
kit:
  name: runner-kit
  version: 0.3.0
  licence: GPL-3.0
  summary: "A task runner for coding agents: a written queue of small tasks, one fresh unattended session per task, rules enforced by code at commit time."

requirements:
  - name: git
    check: "git --version"
  - name: python3
    minimum: "3.9"
    note: "Standard library only."
    check: "python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'"
  - name: zsh
    minimum: "5"
    note: "The scripts are zsh and are not ported to another shell."
    check: "zsh -c 'print $ZSH_VERSION'"
  - name: tmux
    note: "Runs the queue unattended. Not needed by the self-test."
    check: "tmux -V"
  - name: an agent command-line tool, installed and signed in
    any_of:
      - {adapter: claude, command: claude, signed_in_check: "claude auth status", sign_in: "claude auth login"}
      - {adapter: codex, command: codex, signed_in_check: "codex login status", sign_in: "codex login"}
  - all_at_once: "<kit>/bin/runner-doctor"

files:
  - {path: INSTALL-PROMPT.md, purpose: "The one prompt an owner pastes into a coding agent to install the kit.", installs_to: "stays in the kit"}
  - {path: README.md, purpose: "What the kit is, for a person.", installs_to: "stays in the kit"}
  - {path: PROTOCOL.md, purpose: "The protocol every session follows.", installs_to: "stays in the kit; the workspace files and the optional pointer line refer to it by path"}
  - {path: manifest.yaml, purpose: "This index.", installs_to: "stays in the kit"}
  - {path: interview.yaml, purpose: "The questions an installing agent asks, and how to answer them without asking.", installs_to: "stays in the kit"}
  - {path: rules.yaml, purpose: "The carrying rules, with where each is checked and whether code enforces it.", installs_to: "stays in the kit"}
  - {path: docs/before-after.svg, purpose: "The chart shown in README.md.", installs_to: "stays in the kit"}
  - {path: .gitignore, purpose: "Keeps runs/ and temporary files out of the kit's git history.", installs_to: "stays in the kit"}
  - {path: LICENSE, purpose: "The GNU General Public License, version 3.", installs_to: "stays in the kit"}
  - {path: bin/run_queue.sh, purpose: "Walks the queue, one task at a time; starts a stop session when a task stops.", installs_to: "stays in the kit; run from the workspace"}
  - {path: bin/run_task.sh, purpose: "Runs one task to its commit, retrying and resuming.", installs_to: "stays in the kit; run from the workspace"}
  - {path: bin/runner_checks.py, purpose: "The commit checks and the prerequisite check.", installs_to: "stays in the kit; called by the pre-commit hook and by run_task.sh"}
  - {path: bin/render_stream.py, purpose: "Turns an agent's event stream into one readable log line per event.", installs_to: "stays in the kit"}
  - {path: bin/runner-init, purpose: "Starts a project: copies the templates, writes runner.conf, installs the hook.", installs_to: "stays in the kit"}
  - {path: bin/runner-doctor, purpose: "Checks the requirements, the agents and, given a runner.conf, a project's settings and hooks. Changes nothing.", installs_to: "stays in the kit"}
  - {path: bin/runner-queue, purpose: "Shows the task in hand, parked tasks and tasks remaining.", installs_to: "stays in the kit; run from the workspace"}
  - {path: bin/runner-notify, purpose: "Sends one message through the notifier named by NOTIFY.", installs_to: "stays in the kit"}
  - {path: bin/runner_report.py, purpose: "Tells a dashboard what one runner is doing: reads the workspace's files every two seconds and sends what changed. Does nothing when no dashboard is set. Where its state arrives and a file does not, it names the file on the dashboard, sends the rest, and sends logs in smaller pieces. With --in-charge, records the supervising session that runs it as the session in charge of the runner.", installs_to: "stays in the kit; started by run_queue.sh and run_task.sh, or by hand to attach to a queue already running"}
  - {path: dashboard/serve.py, purpose: "The runner dashboard: takes what runners report and serves the page that shows them.", installs_to: "stays in the kit; run on the one machine every runner can reach"}
  - {path: dashboard/index.html, purpose: "The dashboard's page: one pane for each runner, with what it has delivered, its live output and its task list.", installs_to: "stays in the kit; served by dashboard/serve.py"}
  - {path: dashboard/service-macos.sh, purpose: "Keeps dashboard/serve.py running on a Mac as a launchd agent, with a token it makes itself.", installs_to: "stays in the kit; run once on the machine that holds the dashboard"}
  - {path: adapters/claude.sh, purpose: "Adapter for Claude Code.", installs_to: "stays in the kit; sourced by run_task.sh and run_queue.sh"}
  - {path: adapters/codex.sh, purpose: "Adapter for Codex.", installs_to: "stays in the kit; sourced by run_task.sh and run_queue.sh"}
  - {path: adapters/stub.sh, purpose: "An adapter with no agent: a session is one run of the script named by STUB_SCRIPT. For the self-test and for trying the runner's logic without spending anything. Not a builder.", installs_to: "stays in the kit; sourced by run_task.sh and run_queue.sh"}
  - {path: adapters/TEMPLATE.sh, purpose: "The adapter contract, for adding another agent.", installs_to: "stays in the kit"}
  - {path: notify/none.sh, purpose: "Notifier: the log only.", installs_to: "stays in the kit"}
  - {path: notify/desktop.sh, purpose: "Notifier: a desktop notice (osascript on macOS, notify-send on Linux), with the log as fallback.", installs_to: "stays in the kit"}
  - {path: notify/command.sh, purpose: "Notifier: the owner's own command, with the message as one argument.", installs_to: "stays in the kit"}
  - {path: templates/runner.conf, purpose: "The settings file, with a comment on every key.", installs_to: "<workspace>/runner.conf, with PROJECT, WORKSPACE, REPOS and DEPLOYS filled by runner-init"}
  - {path: templates/SESSION-PROMPT.md, purpose: "The first message of every task session.", installs_to: "<workspace>/SESSION-PROMPT.md"}
  - {path: templates/SUPERVISOR-PROMPT.md, purpose: "The first message of every stop session.", installs_to: "<workspace>/SUPERVISOR-PROMPT.md"}
  - {path: templates/REVIEW-CLAUDE.md, purpose: "The reviewer step for the claude adapter.", installs_to: "<workspace>/REVIEW-CLAUDE.md"}
  - {path: templates/REVIEW-CODEX.md, purpose: "The reviewer step for the codex adapter.", installs_to: "<workspace>/REVIEW-CODEX.md"}
  - {path: templates/DELIVERY-RULES.yaml, purpose: "The project's outcomes (empty) and the carrying rules.", installs_to: "<workspace>/DELIVERY-RULES.yaml"}
  - {path: templates/TASKS.md, purpose: "A starter task file with one example task.", installs_to: "<workspace>/TASKS.md"}
  - {path: templates/DECISIONS.md, purpose: "An empty decisions file.", installs_to: "<workspace>/DECISIONS.md"}
  - {path: templates/RUN-ORDER.md, purpose: "A starter queue file.", installs_to: "<workspace>/RUN-ORDER.md"}
  - {path: templates/pre-commit, purpose: "The git hook that runs the commit checks inside a runner session.", installs_to: "<repo>/.git/hooks/pre-commit in each code repository and the repository holding the workspace, only where no hook exists"}
  - {path: templates/deploy.sh, purpose: "A deploy skeleton: LIVE only after the running process is verified. Has a check mode.", installs_to: "<workspace>/deploy.sh, only with runner-init --deploy"}
  - {path: schema/runner.conf.schema.json, purpose: "Every key of runner.conf, as a JSON Schema of a documented key list.", installs_to: "stays in the kit"}
  - {path: schema/task-heading.json, purpose: "A regular expression and examples for a valid task heading.", installs_to: "stays in the kit"}
  - {path: selftest/run.sh, purpose: "The self-test.", installs_to: "stays in the kit; works in a temporary directory"}
  - {path: selftest/dashboard.py, purpose: "Fifty-four checks of the dashboard and of the program that reports to it, beyond line (o) of the self-test. Needs no agent and spends nothing.", installs_to: "stays in the kit; works in a temporary directory, on 127.0.0.1"}

install:
  - step: 1
    what: "Check the machine. Stop if any line starts MISSING."
    command: "<kit>/bin/runner-doctor"
  - step: 2
    what: "Create the workspace directory if it does not exist. It must be inside a git repository."
    command: "mkdir -p <workspace>"
  - step: 3
    what: "Copy the templates, write runner.conf and install the hooks. Add --deploy only if the answer to question 'deploy' is yes. If it prints a line to add to an existing hook or .gitignore, show the owner that line and add it only on the owner's yes."
    command: "<kit>/bin/runner-init [--deploy] <workspace> <repo> [<repo> ...]"
  - step: 4
    what: "Fill <workspace>/runner.conf from the interview answers, by editing the KEY=value lines in place (rules at the top of the file; keys in schema/runner.conf.schema.json). At least: PROJECT, PRODUCT_DIRS, FREE_DIRS, CHECK_CMD, NOTIFY, an ADAPTER and a MODEL for each letter in use, DEFAULT_BUILDER, DEFAULT_REVIEWER, SUPERVISOR, DEPLOYS and LIVE_CHECK_CMD."
    command: null
  - step: 5
    what: "Put the owner's outcomes in <workspace>/DELIVERY-RULES.yaml: replace 'goal_outcomes: []' with a list of '- id: G1' / 'outcome: \"...\"' entries, and set meta.written to today's date."
    command: null
  - step: 6
    what: "Check the settings. Stop if any line starts MISSING."
    command: "<kit>/bin/runner-doctor <workspace>/runner.conf"
  - step: 7
    what: "Run the self-test (below) and show its output."
    command: "<kit>/selftest/run.sh --conf <workspace>/runner.conf"
  - step: 8
    what: "Only after the self-test passes, and only on the owner's yes: write the pointer line of question 'protocol_scope' into the instruction file it names."
    command: null
  - step: 9
    what: "Commit the new workspace files in the repository that holds them, naming each path, if the owner wants them committed."
    command: null

selftest:
  command: "<kit>/selftest/run.sh --conf <workspace>/runner.conf"
  other_forms:
    - "<kit>/selftest/run.sh --adapter <adapter> --model <model id> [--effort medium] [--notify none|desktop|command]"
    - "<kit>/selftest/run.sh --no-agent"
  what_it_does: "Builds a toy code repository and a toy workspace in a temporary directory, initialises them with the kit and proves fifteen facts. Line (b) starts one real agent session with the default builder; every other line spends nothing. Lines (c) to (h) make real commits against the hook. Lines (i) to (m) run run_task.sh and run_queue.sh with a stand-in session (adapters/stub.sh). Line (o) starts a dashboard on this machine, on a free port, and stops it again; every other line runs with the dashboard switched off, so the toy project never shows on a dashboard the machine reports to. Nothing outside the temporary directory is changed. Details are in selftest.log there; the path is printed on standard error."
  expected_output:
    - "PASS (a) a dry queue pass picks the first task"
    - "PASS (b) the default builder ran a task to a commit whose subject starts with the task id, and the heading is marked [x]"
    - "PASS (c) the commit check refused a staged new file that the task does not name"
    - "PASS (d) the commit check refused a new function, and a new async function, that nothing outside the tests calls"
    - "PASS (e) the commit check refused a second new task, a sub-task of a sub-task, more than 20 added lines and an unsigned start condition"
    - "PASS (f) a task whose prerequisite is not done is stopped before a session starts"
    - "PASS (g) the commit check refused a live switch while an open task says the user would see something false"
    - "PASS (h) the commit check accepted a commit that keeps every rule"
    - "PASS (i) run_task.sh counted a task done on its commit and its [x], with no agent"
    - "PASS (j) a commit that broke the project's check was sent back to its session, and the task ended done only once the check passed"
    - "PASS (k) a check that already failed was reported to the owner, and the task ran and was marked as not judged against it"
    - "PASS (l) a task that asked a question was parked, and a task that needs it was parked with it; a supervising entry under a new date did not release them; the owner's answer did, even when written while the stop session ran"
    - "PASS (m) three different tasks stopping one after another paused the queue and told the owner, and it went on only when told to; a task that a wrong setting stopped from starting paused it too, with no stop session"
    - "PASS (n) the configured notifier delivered a message"
    - "PASS (o) a task run by hand and a queue each reported themselves to a dashboard, with their output, what was delivered, the task file, the agent session at the task and the session in charge; a report without the token was refused; a name given to the runner was kept and one sent from another site refused; each reporter ended with its runner"
    - "SELFTEST: PASS"
  with_no_agent:
    note: "Line (b) is replaced by 'SKIP (b) no agent session was started (--no-agent); a real task run is not proven' and the last line is SELFTEST: PARTIAL. Every other line is as above. PARTIAL is not a pass."
  exit_codes: {"0": "SELFTEST: PASS", "1": "SELFTEST: FAIL", "2": "SELFTEST: PARTIAL, or a usage error before any line is printed"}
  on_failure: "A failed fact prints a line starting FAIL with the reason, and the last line is SELFTEST: FAIL. Do not report the install as working."

after_install:
  - "Write <workspace>/DESIGN.md with the owner: what is being built and why."
  - "Write the first tasks in <workspace>/TASKS.md (PROTOCOL.md section 4) and their ids in <workspace>/RUN-ORDER.md; delete the example task."
  - "If the project deploys, write the PROJECT section of <workspace>/deploy.sh and run '<workspace>/deploy.sh check'."
  - "Dry pass, from the workspace: QUEUE_DRY=1 QUEUE_ONCE=1 <kit>/bin/run_queue.sh"
  - "Start the queue, from the workspace: tmux new -d -s <project>-runner <kit>/bin/run_queue.sh"
  - "Watch: <kit>/bin/runner-queue   Stop after the current task: touch <workspace>/runs/queue.stop"
  - "Optional, once for a machine: to see every runner on one page, start <kit>/dashboard/serve.py where the runners can reach it and name its address in ~/.config/runner-kit/dashboard.conf (PROTOCOL.md section 11). Every runner started on the machine then reports by itself."

adapters:
  claude:
    file: adapters/claude.sh
    agent: "Claude Code"
    status: proven
    actually_run:
      - "The self-test, in full, on macOS with a mid-tier model at medium effort: SELFTEST: PASS. Line (b) ran one task through run_task.sh in one attempt: one reviewer subagent, a commit in the code repository with the task id first, a second commit marking the heading [x] in the workspace repository, the hook active in both, exit 0."
      - "One real task through run_queue.sh (one pass, not dry) in a project whose workspace is a directory inside its one code repository, with a task id above 9 before the dot and the desktop notifier: done in one attempt, exit 0."
      - "With the machine's own agent settings left out, a session started with the adapter's flags ran a shell command only when CLAUDE_ALLOWED_TOOLS named Bash, and was denied without it."
    not_run:
      - "Resuming a session (adapter_resume) and a stop session started by run_queue.sh, with this adapter. The runner's side of both is proven with the stand-in session."
      - "A failed sign-in, a network or overload error and a usage limit: the handling is carried over from the toolkit this kit was made from and was not triggered here."
      - "CLAUDE_MIN_VERSION, a narrowed CLAUDE_ALLOWED_TOOLS, and a long task under the five-tool list: sessions in the project this kit came from called only those five tools in 147 sessions, but none of those sessions ran with the list in force."
      - "An API key in place of the command-line tool's own sign-in. The adapter unsets the API key variables for its sessions."
  codex:
    file: adapters/codex.sh
    agent: "Codex"
    status: experimental
    actually_run:
      - "Nothing has been run through adapters/codex.sh as it stands in this kit, beyond a syntax check and the signed-in check."
      - "Before the adapters were split into their own files, the same commands ran one toy task through run_task.sh to a commit in one attempt (review run, task id first, heading marked [x], exit 0), and a resume with the same settings was shown by hand."
    known_limits:
      - "Its review step can be refused by Codex's own approval reviewer: the review command cannot start inside the sandbox, the session asks to run it outside, and the automatic approval review decides. It was allowed twice and refused once in three tries. On a refusal the session ends RUNNER: blocked, which costs a stop session."
      - "Resume through the runner is untested."
      - "Failure handling is untested: an expired sign-in and a network error are recognised only as far as a turn.failed event says, and there is no wait for a Codex usage limit."
      - "A stop session on the codex adapter is untested."
      - "The model id must be one the signed-in account may use; an id the account may not use is refused when the session starts."
      - "A small task can use a large number of input tokens."
  TEMPLATE:
    file: adapters/TEMPLATE.sh
    agent: "none; the contract for adding one"
    status: untested
    actually_run: ["A syntax check only."]

status:
  proven:
    - "zsh -n on every zsh script and python3 -m py_compile on both Python files pass."
    - "The self-test passes with the claude adapter (all fifteen lines, with a mid-tier model at medium effort, CLAUDE_TOOLS='Bash Read Edit Write Task' and CLAUDE_MCP=no: the session had those five tools and no MCP server, started its one reviewer, ran the project's check and committed), and prints PARTIAL with --no-agent."
    - "The dashboard, by the self-test's line (o), on one machine: a task run by hand and a queue each start a reporter; the dashboard shows the runner, its output lines, what it delivered and its task file; the agent session at the task is named by the identifier in the runner's own log, and the session recorded with --in-charge is named as in charge; a report without the token is refused with 401; a name given to a runner is tidied, kept and taken back, a name sent with the header of another site is refused with 403, and a name for a runner the dashboard does not hold with 404; each reporter ends with its runner and frees its lock. With the start line taken out of run_queue.sh in a copy of the kit, only line (o) fails, and likewise with the start line taken out of run_task.sh."
    - "The dashboard, by hand on one machine, with reporters reading copies of two real workspaces: only new output lines are sent, a line still being written waits until it is whole, and the end of one session log arrives before the start of the next; after the dashboard is stopped for seven seconds the reporter says so once in the queue log, carries on, and sends its output afresh with no line twice; after a restart the dashboard shows each runner and its task file at once from its state directory; a second reporter for the same workspace exits at once. Refused: a body that is not a JSON object, an id that is not a plain word."
    - "selftest/dashboard.py prints PASS for each of its fifty-four facts and FAILS=0, under Python 3.14 and under Python 3.9, on macOS. A report in the wrong shape: one holding NaN is refused and one in the wrong shape is read into the page's own shape, so neither stops the page showing the other runners, and a state file that already holds NaN is read back clean. Names and hosts: a redirect is not followed, so the token reaches no other address; a request sent to a name the dashboard was not given is refused, --allow-host adds a name, and a reporter refused for that reason is told which option to give; a name sent from another site is refused, and one from the dashboard's own page is taken when a proxy hands it on under another name; a name that cannot be saved is refused and not shown. Refusals: a report with no token is refused when only its first bytes have arrived; a large report with the wrong token, and one too large, each hear why and are not left with a broken connection. Cost: reports made to cost memory or time (a million empty lists, a million empty texts, lists a hundred thousand deep, a number three million digits long, one text of four million characters) are refused or read for what they are, and while it read twelve of them the dashboard held 58 MB more than before under Python 3.14 and 49 MB more under 3.9; a page's question is answered, the slowest in under a tenth of a second, while reports of two million lines each pour in. Places: sixty-four callers that connect and say nothing, or begin a request and stop, do not shut out the next ten; a place is taken from the caller waited on longest and never from one being worked for. Lines: a report whose answer was lost on the way back is not shown twice; a line holding a line separator, a form feed or a return stays one row; a line of 600,000 characters is one row; a last line with no line feed arrives once the runner has ended; a file put in another's place, a file written again where it lies and a file cut short are each read from a whole line, under a rule across the output; the task runs in a queue log written again are counted afresh; a page's place among the lines does not outlive the runner's life on the dashboard. What cannot arrive: behind a stand-in for a proxy that takes small requests only, a log too large for it arrives in smaller pieces with each line once, a task file too large for it is named in the runner's pane while the output arrives, is tried again less and less often, and arrives once it can; the queue log hears of it once; a task file longer than a dashboard takes is sent cut at a line and says so. Processes and identifiers: a queue lock naming a process that is not a queue is not followed; a reporter that sees its queue running again stays with it; an identifier that is not plainly one is dropped by the reporter, by --in-charge and by the dashboard; runner_report.py --check fails on a wrong token and on a missing one."
    - "One reviewer, two passes. The first read this change (the dashboard, the reporter and the two start lines) and ran it under Python 3.9. Each fault it reproduced has a line in selftest/dashboard.py, and so has each fault in the reporter and the dashboard that it read but did not run; those in the page's own script (the hourly chart when two clocks differ, a median under a minute, a path with a dot in it) were changed and looked at in a browser, and no program tests them. The second pass ran the fixes. It found three facts in selftest/dashboard.py that could not fail, two faults not fully fixed (a log written again where it lies; the memory one report could cost) and five new ones (callers that say nothing shutting the others out; a failure of large reports only, which was hidden; a wrong token on a large report told as a broken connection; a refusal that did not say what to do; a name refused behind a proxy). Each is fixed and has a fact there."
    - "selftest/dashboard.py can fail. Nineteen things its facts rest on were each taken out of a copy of the kit, one at a time: the refusal before the body is read, the reading and dropping after a refusal, the count of values, the limit on a number's length, the short hold of the lock while a report is taken (made two seconds), the giving way of a caller waited on, the page's name as the owner gave it, the count of escapes in a text, the rule for a log written again, the name written before it is shown, the forgetting of what the dashboard holds after a lost answer, the memory of what stood before the place a file was read to, the same for the count of task runs, the leaving out of a file that does not arrive, the smaller pieces, the longer waits between tries, the dashboard's own words in a refusal, the cutting of a long task file, and the silence about the dashboard while only files are in doubt. Each time the facts that prove it failed."
    - "The page, in one Chromium-based browser against that dashboard: a pane appears for a runner that starts while the page is open, with no reload; output, the task list and the plain TASKS.md open from each pane; a stopped runner whose last report is made to look 40 minutes old moves to the list below; at 380, 600, 720, 920, 1240 and 2560 pixels wide nothing is wider than the window; a report whose every text field holds HTML is shown as text and runs nothing; no console errors. A report that names its agent 'constructor', a word every object in a browser knows, is shown like any other; before a fix the review prompted, its pane was not shown at all. A pane whose report says that a file does not reach the dashboard says so above its output, at 375 pixels wide as well, and a log written again is marked by a rule."
    - "The page's two ways back to the work, in that browser: a name typed beside a runner replaced its name on the page and was returned by the dashboard, with the project's own name kept in the line beneath; a click on the identifier under the name copied 'claude --resume <id>'. The identifiers shown were compared with the logs of two real workspaces. bin/runner_report.py --in-charge took its identifier from CLAUDE_CODE_SESSION_ID in a Claude Code desktop session, refused when the shell carried none, and took --agent and --session."
    - "The command the page copies for a Claude Code session: 'claude --resume <id>', run from another directory with Claude Code 2.1.284, reopened the session the self-test's runner had started for its real task. It named that task and answered under the same identifier."
    - "bin/runner_report.py --check, and the runner-doctor line it feeds: no dashboard set, a dashboard that answers, a port with no listener, an address that answers as something else, and a python3 that the machine refuses the network (on this Mac, the one shipped with Xcode, against an address on a private network)."
    - "dashboard/service-macos.sh print writes a launchd file that plutil accepts."
    - "Each line of the self-test fails when the behaviour it proves is switched off: the caller check, the new-file check, the start-condition check, the project's check on a commit, the notice for a check that already fails, the release of a parked task, the pause after three stops, the pause on a wrong setting, the parking of a dependent task and the keeping of an answer written during a stop session were each disabled in a copy of the kit, and each time only that line failed."
    - "runner-init writes the files and hooks and keeps every file that exists."
    - "By the self-test, with real commits against the hook: the commit check refuses an unnamed new file, a function nothing calls, a second task heading in one commit, an id with a second suffix, more than 20 added lines in TASKS.md, an unsigned start condition and a live switch while an open task says the user would see something false; it accepts a commit that keeps every rule. The prerequisite check stops a task whose Needs task is not done."
    - "By hand: the commit check accepts a second task or a start condition with a decision signed (owner, <date>). Task ids above 9 before the dot are read."
    - "By the self-test, with the stand-in session (adapters/stub.sh): run_task.sh counts a task done on its commit and its [x]; a commit that turns the project's check from passing to failing sends the session back, by a resume, and the task is done only when the check passes; a check that already fails is reported once and the task's done message says it was not judged; a task that asks a question goes to a stop session and is parked; an entry signed by a supervising session does not release it and the owner's does; three different tasks stopping in a row pause the queue until runs/queue.go; the stop file stops the queue."
    - "Notifiers: none; command, with a command that succeeded and one that failed; desktop through osascript on macOS, and its log fallback when no notice tool is found."
    - "The deploy.sh skeleton, with stand-in commands on one machine: unfilled it prints NOT LIVE; filled it prints LIVE and writes runs/live-sha; when the process was not restarted it prints NOT LIVE and leaves runs/live-sha unchanged."
  experimental:
    - "The codex adapter (see adapters.codex)."
  untested:
    - "Linux, and any macOS shell setup where zsh is not on the PATH."
    - "notify-send on Linux."
    - "With a real agent: a stop session and its verdicts, and resuming a session. Both are proven only with the stand-in session."
    - "The stop-session verdicts retry and run ... then, the third stop of one task, and the lock against a second queue."
    - "The failure paths of run_task.sh that depend on the agent: a failed sign-in, a network or overload error, a usage limit."
    - "The release of a paused queue by a change to the workspace (the self-test releases it with runs/queue.go)."
